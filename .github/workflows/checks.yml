name: Tooling checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  manifest-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test file and directory verification without game assets
        run: python -B -m unittest discover -s tests -v
